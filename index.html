<!DOCTYPE html>

<title>Moja Slovenija</title>

<style>
:root{--brown:#6b4423;--cream:#fff8ec;--cardH:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe6ea;font-family:Nunito,system-ui,sans-serif;color:var(--brown);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas.drag{cursor:grabbing}
.title{position:fixed;left:14px;top:10px;font:800 26px Grandstander,Nunito,sans-serif;color:#fff;text-shadow:0 2px 0 #6b4423,0 0 6px rgba(0,0,0,.35);pointer-events:none;z-index:3}
.bag{position:fixed;left:14px;top:50px;display:flex;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--brown);border-radius:18px;padding:4px 12px;font-weight:900;z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.bag .bar{width:90px;height:10px;border-radius:6px;background:#e9dcc4;overflow:hidden}.bag .bar i{display:block;height:100%;background:#f2b33d;width:0}
.menu{position:fixed;right:10px;top:10px;display:flex;flex-direction:column;gap:7px;z-index:3}
.tb{font:900 15px Nunito,sans-serif;color:var(--brown);background:var(--cream);border:3px solid var(--brown);border-radius:16px;padding:6px 12px;min-width:118px;text-align:left;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.22);display:flex;align-items:center;gap:8px}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.tb.on{background:#ffe08a}
.tb .ic{font-size:18px}
@media (max-width:700px){.tb{min-width:0;padding:6px 9px}.tb .tx{display:none}.title{font-size:20px}}
.card{position:fixed;left:50%;bottom:-420px;transform:translateX(-50%);width:min(560px,94vw);background:var(--cream);border:4px solid var(--brown);border-radius:26px;padding:14px 16px 14px 14px;display:flex;gap:14px;z-index:5;transition:bottom .35s cubic-bezier(.2,1.3,.4,1);box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25)}
.card.show{bottom:max(12px,env(safe-area-inset-bottom))}
.card .pic{width:120px;height:120px;flex:none;display:flex;align-items:center;justify-content:center}
.card .pic img{max-width:120px;max-height:120px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.card h2{margin:0 0 4px;font:800 26px Grandstander,Nunito,sans-serif}
.card p{margin:0 0 8px;font-size:17px;line-height:1.3;font-weight:700}
.card .btns{display:flex;flex-wrap:wrap;gap:6px}
.card .btns button{font:900 14px Nunito,sans-serif;color:var(--brown);background:#ffe9b0;border:3px solid var(--brown);border-radius:14px;padding:5px 11px;cursor:pointer}
.card .x{position:absolute;right:10px;top:6px;border:none;background:none;font:900 26px Nunito;color:var(--brown);cursor:pointer}
.more{display:none;font-size:15px;margin-top:6px}.more ul{margin:4px 0 0 18px;padding:0}.more .mi{font-weight:900}
@media (max-width:520px){.card{flex-direction:column;align-items:center;text-align:center}.card .pic{width:90px;height:90px}.card .pic img{max-width:90px;max-height:90px}.card .btns{justify-content:center}}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--cream);border:3px solid var(--brown);border-radius:18px;padding:8px 16px;font-weight:900;z-index:6;transition:transform .3s;max-width:88vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#cfe6ea;z-index:9;font:800 24px Grandstander,Nunito,sans-serif;transition:opacity .6s}
.loading .bee{font-size:56px;animation:b 1s infinite alternate}@keyframes b{to{transform:translateY(-12px)}}
.quest{position:fixed;left:50%;top:12px;transform:translate(-50%,-140px);transition:transform .35s;z-index:4;background:#ffe9b0;border:4px solid var(--brown);border-radius:22px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.quest.show{transform:translate(-50%,0)}.quest img{height:54px}.quest .qk{font-weight:900;font-size:13px}.quest .qn{font:800 22px Grandstander,Nunito,sans-serif}.quest button{border:none;background:none;font:900 22px Nunito;color:var(--brown);cursor:pointer}
@media (max-width:700px){.quest{top:auto;bottom:calc(12px + var(--cardH))}.quest.show{transform:translate(-50%,0)}.quest:not(.show){transform:translate(-50%,200px)}}
.zoom{position:fixed;right:10px;bottom:calc(14px + var(--cardH));display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:46px;height:46px;font:900 26px Nunito;color:var(--brown);background:var(--cream);border:3px solid var(--brown);border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.22);cursor:pointer}
</style></head><body>

let AC=null, master, sfxOn=true, musicOn=true, musicGain;
function audioInit(){ if(AC) { if(AC.state==='suspended') AC.resume(); return; } try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.7; master.connect(AC.destination);
  musicGain=AC.createGain(); musicGain.gain.value=musicOn?1:0; musicGain.connect(master); startMusic(); }catch(e){ AC=null; } }

}
const PRI={mesto:0,big:1,les:2,kraj:3};
function overlap(a,b){ return a[0]<b[0]+b[2]&&b[0]<a[0]+a[2]&&a[1]<b[1]+b[3]&&b[1]<a[1]+a[3]; }
function drawSigns(){ const s=cam.s; const placed=[]; const objR=OBJ.filter(o=>o.sb&&o.kind!=='dec'&&visibleObj(o)).map(o=>({r:o.sb,it:o.it}));
  const list=SIGNS.slice().sort((a,b)=>PRI[a.kind]-PRI[b.kind]);
  for(const g of list){ g.sb=null; const [sx,sy]=w2s(g.x,g.y); if(sx<-200||sx>VW+200||sy<-100||sy>VH+200) continue;
    if(g.kind==='big'){ if(s>.12||!labels) continue; const fz=(g.it.c==='drzava'?17:13)*Math.min(1,Math.max(.75,VW/1100)); ctx.font=`800 ${fz}px Grandstander,Nunito,sans-serif`; const tw=ctx.measureText(g.it.n).width; const r=[sx-tw/2,sy-fz,tw,fz*1.3];
      if(placed.some(p=>overlap(p,r))) continue; placed.push(r); ctx.textAlign='center'; ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.fillStyle=g.it.c==='drzava'?'#8a6d5a':'#5a3a20'; ctx.strokeText(g.it.n,sx,sy); ctx.fillText(g.it.n,sx,sy); g.sb=r; continue; }
    if(!g.sc.ready) continue;
    const SC=Math.min(1,Math.max(.62,VW/1100)); let w; if(g.kind==='mesto'){ if(!labels&&s>.2) continue; w=(s>.25?100:s>.13?72:54)*SC; } else if(g.kind==='kraj'){ if(s<.16||!labels) continue; w=70*SC*(.7+.3*Math.min(1,(s-.16)/.4)); } else { if(s<.2||!labels) continue; w=78*SC*(.7+.3*Math.min(1,(s-.2)/.4)); }
    const c=g.sc.c, h=w*c.height/c.width;
    const cands=[[0,4],[0,h*.9+10],[-w*.8,4],[w*.8,4],[0,-h-30]];
    let best=null; for(const [dx,dy] of cands){ const r=[sx-w/2+dx,sy+dy-h,w,h]; const bad=placed.some(p=>overlap(p,r))||objR.some(o=>o.it!==g.it&&overlap(o.r,[r[0]+w*.1,r[1]+h*.1,w*.8,h*.8]))||objR.some(o=>o.it===g.it&&overlap(o.r,[r[0]+w*.15,r[1],w*.7,h*.7])); if(!bad){ best=r; break; } }
    if(!best){ if(g.kind!=='mesto') continue; best=[sx-w/2,sy+4-h,w,h]; }
    placed.push(best); ctx.drawImage(c,best[0],best[1],w,h); g.sb=best; } }
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle='#d8d3bf'; ctx.fillRect(0,0,VW,VH);
  drawTiles();
  const vis=OBJ.filter(visibleObj).sort((a,b)=>a.y-b.y); for(const o of vis) drawObj(o);
  drawSigns();
  if(cam.s<.16&&cloudImg.complete&&cloudImg.naturalWidth){ ctx.globalAlpha=Math.min(1,(.16-cam.s)/.06)*.6; for(const c of CLOUDS){ const [sx,sy]=w2s(c.x,c.y); const w=c.w*cam.s, h=w*cloudImg.naturalHeight/cloudImg.naturalWidth; ctx.drawImage(cloudImg,sx-w/2,sy-h/2,w,h); } ctx.globalAlpha=1; }
}
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  const k=1-Math.pow(.001,dt); cam.s*=Math.pow(tgt.s/cam.s,k); cam.cx+=(tgt.cx-cam.cx)*k; cam.cy+=(tgt.cy-cam.cy)*k;
  step(dt); for(const o of OBJ) if(o.pulse>0) o.pulse=Math.max(0,o.pulse-dt*.7);
  draw(); if(Math.random()<.02) gcTiles(); requestAnimationFrame(frame); }

// ---------------- vnos ----------------
const ptr=new Map(); let drag=null, pinch=null, moved=0;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId,{x:e.clientX,y:e.clientY}); audioInit(); moved=0;
  if(ptr.size===1) drag={x:e.clientX,y:e.clientY,cx:tgt.cx,cy:tgt.cy}; else if(ptr.size===2){ const [a,b]=[...ptr.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:tgt.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,w:s2w((a.x+b.x)/2,(a.y+b.y)/2)}; drag=null; } cv.classList.add('drag'); });
cv.addEventListener('pointermove',e=>{ if(!ptr.has(e.pointerId)) return; ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptr.size>=2){ const [a,b]=[...ptr.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); tgt.s=pinch.s*d/pinch.d; const mx=(a.x+b.x)/2,my=(a.y+b.y)/2; tgt.cx=pinch.w[0]-(mx-VW/2)/tgt.s; tgt.cy=pinch.w[1]-(my-VH/2)/tgt.s; clampCam(tgt); Object.assign(cam,tgt); moved+=10; }
  else if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; moved=Math.max(moved,Math.hypot(dx,dy)); tgt.cx=drag.cx-dx/tgt.s; tgt.cy=drag.cy-dy/tgt.s; clampCam(tgt); cam.cx=tgt.cx; cam.cy=tgt.cy; } });
const up=e=>{ ptr.delete(e.pointerId); if(ptr.size<2) pinch=null; if(ptr.size===0){ cv.classList.remove('drag'); if(drag&&moved<8) tap(e.clientX,e.clientY); drag=null; } else if(ptr.size===1){ const [a]=[...ptr.values()]; drag={x:a.x,y:a.y,cx:tgt.cx,cy:tgt.cy}; } };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{ e.preventDefault(); const f=Math.exp(-e.deltaY*.0015); zoomAt(e.clientX,e.clientY,f); },{passive:false});
function zoomAt(px,py,f){ const w=s2w(px,py); tgt.s*=f; clampCam(tgt); tgt.cx=w[0]-(px-VW/2)/tgt.s; tgt.cy=w[1]-(py-VH/2)/tgt.s; clampCam(tgt); }
$('zIn').onclick=()=>zoomAt(VW/2,VH/2,1.8); $('zOut').onclick=()=>zoomAt(VW/2,VH/2,1/1.8);
function inb(b,x,y){ return b&&x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3]; }
// ---------------- igre ----------------
let game=null;
function pickable(kind){ return ITEMS.filter(it=>it.home&&!it.kraj&&it.c!=='drzava'&&(kind==='animals'?it.c==='zival':it.c!=='zival'&&it.c!=='vozilo'&&it.c!=='gorovje')); }
function startGame(kind){ closeCard(); game={kind,pool:pickable(kind).sort(()=>Math.random()-.5),score:0}; $('bGame').classList.toggle('on',kind==='find'); $('bAnimals').classList.toggle('on',kind==='animals'); nextQ(); }
function stopGame(){ game=null; $('quest').classList.remove('show'); $('bGame').classList.remove('on'); $('bAnimals').classList.remove('on'); }
function nextQ(){ if(!game) return; if(!game.pool.length) game.pool=pickable(game.kind).sort(()=>Math.random()-.5); game.cur=game.pool.pop();
  const it=game.cur; $('qKind').textContent=game.kind==='animals'?'Poišči žival':'Poišči'; $('qName').textContent=it.n; const p=$('qPic'); p.innerHTML=''; const src=picFor(it); if(src&&game.kind==='animals'){ const im=new Image(); im.src=src; p.appendChild(im); }
  $('quest').classList.add('show'); say('Poišči: '+it.n); }
function answer(it,o){ if(!game) return false; if(it===game.cur){ if(o) o.pulse=1; play('cheer'); game.score++; showCard(it,it.f[0]); say('Bravo! '+it.n+'. '+it.f[0]);
    if(!found.has(it.id)){ found.add(it.id); try{ localStorage.setItem('ms2d-found',JSON.stringify([...found])); }catch(e){} updBag(); }
    const b=$('cBtns'); const nx=document.createElement('button'); nx.textContent='Naprej ➜'; nx.style.background='#bfe8a0'; nx.onclick=()=>{ closeCard(); nextQ(); }; b.appendChild(nx); return true; }
  play('boing'); say('To je '+it.n+'. Poskusi še enkrat!'); toast('To je '+it.n+' – poskusi še enkrat!'); return true; }
$('bGame').onclick=()=>{ audioInit(); if(game&&game.kind==='find') stopGame(); else startGame('find'); };
$('bAnimals').onclick=()=>{ audioInit(); if(game&&game.kind==='animals') stopGame(); else startGame('animals'); };
$('qX').onclick=stopGame;
$('quest').onclick=e=>{ if(e.target.id==='qX'||!game) return; say('Poišči: '+game.cur.n); };
function tap(x,y){ // najprej sličice (od spredaj nazaj), nato table
  const vis=OBJ.filter(o=>o.it&&visibleObj(o)&&o.sb).sort((a,b)=>b.y-a.y);
  for(const o of vis) if(inb(o.sb,x,y)){ select(o.it,o); return; }
  for(const g of SIGNS) if(g.sb&&inb(g.sb,x,y)){ select(g.it); return; }
  closeCard(); }
// ---------------- kartica ----------------
let found=new Set(); try{ JSON.parse(localStorage.getItem('ms2d-found')||'[]').forEach(x=>found.add(x)); }catch(e){}
const COLLECT=ITEMS.filter(i=>!i.kraj);
function updBag(){ const n=COLLECT.filter(i=>found.has(i.id)).length; $('bagF').style.width=(n/COLLECT.length*100)+'%'; $('bagN').textContent=n+'/'+COLLECT.length; }
function picFor(it){ const o=OBJ.find(o=>o.it===it); if(o) return 's/'+o.name+'.webp'; const g=SIGNS.find(g=>g.it===it); if(g&&g.sc&&g.sc.ready) return g.sc.c.toDataURL(); return null; }
function nearby2(it,n){ if(!it.home) return []; return ITEMS.filter(o=>o!==it&&o.home&&!o.country&&!o.range&&!o.det&&o.c!=='vozilo'&&o.c!=='zival'&&o.c!=='drzava').map(o=>[o,Math.hypot(o.home[0]-it.home[0],o.home[1]-it.home[1])/P]).filter(x=>x[1]<18).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0].n); }
function select(it,o){ audioInit(); if(game&&answer(it,o)) return; if(o) o.pulse=1; if(it.snd) play(it.snd);
  it.fi=(it.fi==null?0:(it.fi+1)%it.f.length); const fact=it.f[it.fi]; showCard(it,fact);
  if(!found.has(it.id)&&!it.kraj){ found.add(it.id); try{ localStorage.setItem('ms2d-found',JSON.stringify([...found])); }catch(e){} updBag(); setTimeout(()=>play('sticker'),600); }
  say(it.n+'. '+fact);
  if(it.home&&cam.s<.18){ tgt.cx=it.home[0]; tgt.cy=it.home[1]+60; tgt.s=Math.max(tgt.s,.35); clampCam(tgt); } }
function showCard(it,fact){ const p=$('cPic'); p.innerHTML=''; const src=picFor(it); if(src){ const im=new Image(); im.src=src; p.appendChild(im); } else { p.textContent=it.e||''; p.style.fontSize='70px'; }
  $('cName').textContent=it.n; $('cText').textContent=fact; const b=$('cBtns'); b.innerHTML=''; $('cMore').style.display='none';
  const add=(t,f)=>{ const x=document.createElement('button'); x.textContent=t; x.onclick=f; b.appendChild(x); };
  add('🔊 Preberi',()=>say(it.n+'. '+fact)); add('Povej mi več',()=>more(it)); if(it.snd) add('🎵 Zvok',()=>play(it.snd));
  $('card').classList.add('show'); requestAnimationFrame(()=>document.documentElement.style.setProperty('--cardH',($('card').offsetHeight+16)+'px')); }
function more(it){ const box=$('cMore'); box.innerHTML=''; const extra=[...(MORE[it.id]||[]),...(it.f||[])];
  const nb=nearby2(it,3); const ctxl=[]; if(it.at&&it.c!=='drzava') ctxl.push('Pokrajina: '+regionOf(it.at[0],it.at[1])); if(nb.length) ctxl.push('V bližini: '+nb.join(', '));
  for(const l of ctxl){ const d=document.createElement('div'); d.className='mi'; d.textContent=l; box.appendChild(d); }
  const ul=document.createElement('ul'); for(const f of extra){ const li=document.createElement('li'); li.textContent=f; ul.appendChild(li); } box.appendChild(ul); box.style.display='block';
  say(it.n+'. '+(MORE[it.id]||[]).join(' ')+(nb.length?' V bližini so '+nb.join(', ')+'.':'')); }
function closeCard(){ $('card').classList.remove('show'); document.documentElement.style.setProperty('--cardH','0px'); }
$('cardX').onclick=closeCard;
let toastT; function toast(m){ const e=$('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('show'),2600); }
$('bHome').onclick=()=>{ home(); closeCard(); play('pop'); };
$('bLabels').onclick=()=>{ labels=!labels; $('bLabels').classList.toggle('on',labels); };
$('bSound').onclick=()=>{ audioInit(); sfxOn=!sfxOn; $('bSound').querySelector('.ic').textContent=sfxOn?'🔊':'🔇'; if(!sfxOn) stopSay(); };
$('bLabels').classList.toggle('on',labels);
addEventListener('resize',()=>{ resize(); MINS=fitS()*.85; clampCam(tgt); });
resize(); home(); Object.assign(cam,tgt); updBag();
// pred-naloži najgrobejše ploščice
(function pre(){ const z=NZ-1; const nx=Math.ceil(CFG.NTX/2**z), ny=Math.ceil(CFG.NTY/2**z); let n=nx*ny, k=0; for(let y=0;y<ny;y++) for(let x=0;x<nx;x++){ const t=getTile(z,x,y); if(t) t.img.addEventListener('load',()=>{ if(++k>=n) done(); }); }
  let fin=false; function done(){ if(fin) return; fin=true; $('loading').style.opacity=0; setTimeout(()=>$('loading').remove(),700); setTimeout(()=>toast('Klikni na gradove, živali, gore in kraje!'),900); } setTimeout(done,6000); })();
requestAnimationFrame(t=>{ last=t; frame(t); });
window.__ready=true;
</script></body></html>
