<style>
:root{--brown:#6b4423;--cream:#fff8ec;--cardH:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe6ea;font-family:Nunito,system-ui,sans-serif;color:var(--brown);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}

.title{position:fixed;left:14px;top:10px;font:800 26px Grandstander,Nunito,sans-serif;color:#fff;text-shadow:0 2px 0 #6b4423,0 0 6px rgba(0,0,0,.35);pointer-events:none;z-index:3}
.bag{position:fixed;left:14px;top:50px;display:flex;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--brown);border-radius:18px;padding:4px 12px;font-weight:900;z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.2)}

.tb{font:900 15px Nunito,sans-serif;color:var(--brown);background:var(--cream);border:3px solid var(--brown);border-radius:16px;padding:6px 12px;min-width:118px;text-align:left;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.22);display:flex;align-items:center;gap:8px}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.tb.on{background:#ffe08a}
.tb .ic{font-size:18px}
@media (max-width:700px){.tb{min-width:0;padding:6px 9px}.tb .tx{display:none}.title{font-size:20px}}
.card{position:fixed;left:50%;bottom:-420px;transform:translateX(-50%);width:min(560px,94vw);background:var(--cream);border:4px solid var(--brown);border-radius:26px;padding:14px 16px 14px 14px;display:flex;gap:14px;z-index:5;transition:bottom .35s cubic-bezier(.2,1.3,.4,1);box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25)}
.card.show{bottom:max(12px,env(safe-area-inset-bottom))}
.card .pic{width:120px;height:120px;flex:none;display:flex;align-items:center;justify-content:center}
.card .pic img{max-width:120px;max-height:120px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.card h2{margin:0 0 4px;font:800 26px Grandstander,Nunito,sans-serif}
.card p{margin:0 0 8px;font-size:17px;line-height:1.3;font-weight:700}
.card .btns{display:flex;flex-wrap:wrap;gap:6px}
.card .btns button{font:900 14px Nunito,sans-serif;color:var(--brown);background:#ffe9b0;border:3px solid var(--brown);border-radius:14px;padding:5px 11px;cursor:pointer}
.card .x{position:absolute;right:10px;top:6px;border:none;background:none;font:900 26px Nunito;color:var(--brown);cursor:pointer}
.more{display:none;font-size:15px;margin-top:6px}.more ul{margin:4px 0 0 18px;padding:0}.more .mi{font-weight:900}

.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#cfe6ea;z-index:9;font:800 24px Grandstander,Nunito,sans-serif;transition:opacity .6s}

  .poemin .pbtn{position:sticky;top:-20px;background:#fffdf7;z-index:2;padding:8px 0 6px}

  .pbtn button.playing{background:#ffb347}

  .book .x{position:absolute;right:16px;top:14px;border:0;background:#f1f1f1;border-radius:50%;width:46px;height:46px;font-size:24px;cursor:pointer}

.pad{position:fixed;left:14px;bottom:14px;display:none;z-index:4;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px}

.pscore{position:fixed;left:14px;top:92px;display:none;z-index:4;background:#ffe9b0;border:4px solid var(--brown);border-radius:20px;padding:4px 16px;font:800 24px Grandstander,Nunito}
.pscore.show{display:block}
.zoom{position:fixed;right:10px;bottom:calc(14px + var(--cardH));display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:46px;height:46px;font:900 26px Nunito;color:var(--brown);background:var(--cream);border:3px solid var(--brown);border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.22);cursor:pointer}

function splitS(t){ const out=[]; let cur=''; t=String(t).replace(/\s+/g,' ').trim(); for(let i=0;i<t.length;i++){ cur+=t[i]; if('.!?'.includes(t[i])&&(i+1>=t.length||t[i+1]===' ')){ if(cur.trim()) out.push(cur.trim()); cur=''; } } if(cur.trim()) out.push(cur.trim()); return out; }
function h32(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return ('0000000'+h.toString(16)).slice(-8); }
let AUD=null, sayQ=null;
try{ if(location.protocol.startsWith('http')) fetch('audio/index.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{ if(Array.isArray(j)) AUD=new Set(j); }).catch(()=>{}); }catch(e){}
function stopSay(){ if(sayQ&&sayQ.a){ try{ sayQ.a.pause(); }catch(e){} } sayQ=null; try{ speechSynthesis.cancel(); }catch(e){} }
function sayRec(txt){ if(!AUD) return false; const S=splitS(txt); if(!S.length||!S.every(x=>AUD.has(h32(x)))) return false; stopSay(); const tok={}; sayQ=tok; let i=0;
  const next=()=>{ if(sayQ!==tok||i>=S.length) return; const a=new Audio('audio/'+h32(S[i++])+'.mp3'); tok.a=a; a.onended=()=>setTimeout(next,90); a.onerror=()=>next(); const p=a.play(); if(p&&p.catch) p.catch(()=>{}); };
  next(); return true; }
function allPhrases(){ const T=new Set(); const add=x=>{ if(x) for(const s2 of splitS(x)) T.add(s2); };
  for(const it of ITEMS){ const n=it.n; add(n+'.'); add(n+'!'); (it.f||[]).forEach(add); (MORE[it.id]||[]).forEach(add); const nb=nearby(it,3); if(nb.length) add('V bližini so '+nb.join(', ')+'.');
    add('Kje je '+n+'?'); add('Kje so '+n+'?'); add('Poišči: '+n); add('To je '+n+'.'); add('Pismo za '+n+'!'); add('Pismo je za '+n+'.'); }
  for(const k in FKIND){ const K=FKIND[k]; add(K.n+'.'); (K.f||[]).forEach(add); add('Poišči: '+K.n); }
  for(const t of TREASURES){ add(t.n+'.'); (t.f||[]).forEach(add); add('Poišči: '+t.n); }
  ['Kam ga odpeljemo?','Pismo je dostavljeno!','Poskusi še enkrat!','Bravo!','Poleti in poberi zvezdice! S puščicami levo in desno obračaš, gor in dol pa letiš višje ali nižje.','Bravo, pilot! Pobral si vse zvezdice!'].forEach(add);
  return [...T].map(t=>({h:h32(t),t})); }
let noVoiceWarned=false;
function say(txt){ if(!sfxOn) return; if(sayRec(txt)) return; if(!slVoice&&sfxOn&&!noVoiceWarned){ findVoice(); if(!slVoice){ noVoiceWarned=true; setTimeout(()=>toast('Ta brskalnik nima slovenskega glasu 🙁 Za branje odpri zemljevid v Edgeu ali Chromu.'),1200); } } if(!slVoice||!sfxOn) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.voice=slVoice; u.lang=slVoice.lang; u.rate=.95; u.pitch=1.1; speechSynthesis.speak(u); }catch(e){} }

function regionAt(lon,lat){
  if(lat<45.68&&lon<13.98) return 'primorska'; if(lat<45.95&&lon<14.35&&lat>45.55) return 'primorska'; if(lon<13.95&&lat<46.2) return 'primorska';
  if(lon>15.95&&lat>46.47) return 'prekmurje'; if(lat<45.72&&lon>14.95&&lon<15.5) return 'belakrajina'; if(lat>46.45&&lon>14.75&&lon<15.25) return 'koroska';
  if(lon>15.0&&lat>46.12) return 'stajerska'; if(lon>14.55&&lon<15.7&&lat<46.05) return 'dolenjska'; if(lat>46.2&&lon<14.75) return 'gorenjska'; if(lat<45.85) return 'notranjska'; return 'osrednja'; }

const POVODNI=`Od nékdej lepé so Ljubljanke slovele,
al lepši od Urške bilo ni nobene,
nobene očem bilo bolj zaželene
ob času nje cvetja dekleta ne žene. -
Ko nárbolj iz zvezd je danica svetla,
narlepši iz deklic je Urška bila.

Mnogtére device, mnogtére ženice
oko je na skrivnem solzé preliválo,
ker Urški srce se je ljubega vdalo;
al ljubih bilo je nji vedno premalo.
Kar slišala moških okrog je slovét,
skušála jih v mreže razpete je ujet.

Je znala obljúbit, je znalá odreči,
in biti priljudna, in biti prevzetna,
mladenče unémat, bit staršim prijetna;
modrij in zvijač je bila vseh umetna;
možake je dolgo vodila za nos,
ga stakne nazadnje, ki bil ji je kos.

Na Starem so trgu pod lipo zeleno
trobente in gosli, in cimbale pele,
plesále lepote 'z Ljubljane so cele
v nedeljo popoldan z mladenči vesele;
bila je kraljica njih Urška brhka,
plesáti ni dolgo nje volja bila.

Jih dókaj jo prosi, al vsakmu odreče,
prešerna se brani in ples odlašuje,
si vedno izgovore nove zmišljuje,
že sonce zahaja, se mrak približuje;
že sedem odbila je ura in čez,
ko jela ravnat se je Urška na ples.

Al, ker se ozira, plesavca si zbira,
zagleda pri mizi rumeni junaka;
enacga pod soncam mu ni korenjaka,
želi si plesáti z njim deklica vsaka -
omrežit ga Uršika lepa želi,
zaljubljeno v njega obrača oči.

To videt, mladenič se Urški približa:
"Al hôtla bi z mano plesati?" ji pravi,
"kjer Donava bistri pridruži se Savi,
od tvoje lepote zaslišal sem davi,
že, Uršika zala! pred tabo sem zdaj,
že, Uršika zala! pripravljen na raj!"

To reče in se ji globoko prikloni,
sladkó mu nasmeja se Uršika zala:
"Nobene stopinjice še nisem plesala,
de čákala tebe sem, res je, ni šala -
zatorej le hitro mi roko podaj,
lej, sonce zahaja, jenjuje že raj!" -

Podal ji mladenič prelepi je rôko,
in urno ta dvá sta po pódu zletela,
ko de bi lohké peretnice imela,
bila bi brez trupla okrog se vrtela,
ne vidi se, kdaj de pod noga udar',
plesala sta, ko bi ju nosil vihar.

To videti, drugi so vsi ostrmeli,
od čudeža godcam roké so zastale;
ker niso trobente glasova več dale,
mladenča nogé so trdó zaceptale;
"Ne maram," zavpije, "za gosli, za bas,
strun drugih, ko plešem, zapoje naj glas!"

So brž pridrvili se črni oblaki,
zasliši na nebu se strašno gromenje,
zasliši vetrov se sovražno vršenje,
zasliši potokov derečih šumenje,
pričjóčim po koncu so vstali lasje -
oh, Uršika zala, zdaj tebi gorje!

"Ne boj se, ti Urška! le hitro mi stópi,
ne boj se," ji reče, "ne boj se gromenja,
ne boj se potokov ti mojih šumenja,
ne boj se vetrov mi prijaznih vršenja;
le urno, le urno obrni peté,
le urno, le urno, ker pozno je že!"

"Ah, majhno postojva, preljubi plesavec!
de jaz se oddahnem, de noga počije."
"Ni blizo, ni blizo do bele Turčíje,
kjer v Donavo Sava se bistra izlije;
valovi šumeči te, Urška! želé,
le úrno, le urno obrni peté!" -

To reče, hitreje sta se zasukála,
in dalje in dalje od pôda spustila,
na bregu Ljubljance se trikrat zavila,
plesáje v valove šumeče planila.
Vrtinec so vidli čolnarji dereč;
al Uršike videl nobeden ni več.`;

  const el=$('kit'+i); if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  if(!slVoice){ return; } try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(st[i].replace(/[-–]\s*$/gm,'').replace(/'/g,'')); u.voice=slVoice; u.lang=slVoice.lang; u.rate=.9; u.pitch=1;

function audInit(){ const a=$('poemAud'); if(!a||a._i) return; a._i=1;
  a.addEventListener('error',()=>$('poem').classList.add('noaud'));
  a.addEventListener('timeupdate',()=>{ if(a.paused) return; const st=POVODNI.split('\n\n'); let i;
    if(AUD_T){ i=0; while(i+1<AUD_T.length&&a.currentTime>=AUD_T[i+1]) i++; }
    else { const L=st.map(x=>x.length), tot=L.reduce((p,c)=>p+c,0); let acc=0; const f=a.currentTime/(a.duration||1)*tot; i=0; for(;i<L.length;i++){ acc+=L[i]; if(f<acc) break; } }
    i=Math.min(i,st.length-1); if(i!==poemIdx){ poemIdx=i; hl(i); const el=$('kit'+i); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); } });

  a.addEventListener('pause',()=>{ $('poemListen').classList.remove('playing'); $('poemListen').textContent='🎧 Poslušaj'; });

function audSeekKit(i){ const a=$('poemAud'); if(!a||$('poem').classList.contains('noaud')) return false; const st=POVODNI.split('\n\n');
  let t; if(AUD_T) t=AUD_T[i]; else { const L=st.map(x=>x.length), tot=L.reduce((p,c)=>p+c,0); t=L.slice(0,i).reduce((p,c)=>p+c,0)/tot*(a.duration||0); }
  if(!isFinite(t)) return false; a.currentTime=t; a.play().catch(()=>{}); return true; }

function tap(x,y){ // najprej sličice (od spredaj nazaj), nato table
