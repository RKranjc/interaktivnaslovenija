<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ljubljanica – reka sedmih imen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💧%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff;font-family:Nunito,system-ui,sans-serif;color:#4a2f17;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.btn{position:fixed;top:calc(10px + env(safe-area-inset-top));z-index:5;border:3px solid #5a3a1a;background:#fff7e6;border-radius:16px;font:900 20px Nunito,sans-serif;color:#5a3a1a;padding:6px 12px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
#bBack{left:10px}#bPause{right:10px}#bAgain{right:64px}
#name{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:4;background:#fff7e6;border:3px solid #5a3a1a;border-radius:20px;padding:4px 18px 6px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .5s cubic-bezier(.3,1.5,.5,1);white-space:nowrap}
#name.show{transform:translate(-50%,0)}
#name .k{font:900 11px Nunito,sans-serif;letter-spacing:1px;color:#b3661a;text-transform:uppercase}
#name .n{font:800 30px Grandstander,Nunito,sans-serif;line-height:1.05}
#dots{display:flex;gap:5px;justify-content:center;margin-top:3px}
#dots i{width:11px;height:11px;border-radius:50%;border:2px solid #5a3a1a;background:#fff;display:block}
#dots i.on{background:#2f9be0}
#sub{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;width:max-content;max-width:min(760px,92vw);background:rgba(255,253,245,.96);border-radius:18px;padding:9px 16px;font:800 19px/1.3 Nunito,sans-serif;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.2);opacity:0;transition:opacity .3s}
#sub.show{opacity:1}
.ov{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:rgba(20,40,70,.55)}
.ov.show{display:grid}
.card{background:#fff7e6;border:4px solid #5a3a1a;border-radius:28px;padding:20px 26px 22px;text-align:center;width:min(480px,88vw);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.card h1{font:800 30px/1.1 Grandstander,Nunito,sans-serif;margin:6px 0 4px}
.card p{font-weight:800;font-size:17px;margin:6px 0 14px;line-height:1.35}
.card .big{font-size:60px;line-height:1}
.go{border:0;border-radius:22px;background:#2f9be0;color:#fff;font:900 24px Nunito,sans-serif;padding:10px 30px;cursor:pointer;box-shadow:0 6px 0 #1b639a;margin:4px}
.go.alt{background:#ffe9b0;color:#5a3a1a;box-shadow:0 6px 0 #c9a85a;font-size:19px}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1b639a}
@media (max-width:600px){#name .n{font-size:23px}#sub{font-size:16px}.btn{font-size:17px;padding:5px 10px}#bAgain{right:56px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="btn" id="bBack" title="Nazaj na zemljevid">✕</button>
<button class="btn" id="bAgain" title="Od začetka">⟲</button>
<button class="btn" id="bPause" title="Premor">⏸</button>
<div id="name"><div class="k" id="nk">Prvo ime</div><div class="n" id="nn">Trbuhovica</div><div id="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<div id="sub"></div>
<div class="ov show" id="ovStart"><div class="card"><div class="big">💧</div><h1>Ljubljanica<br>reka sedmih imen</h1><p>Poglej, kako se reka sedemkrat skrije pod zemljo in vsakič dobi novo ime.</p><button class="go" id="goStart">▶ Začni</button></div></div>
<div class="ov" id="ovEnd"><div class="card"><div class="big">🎉</div><h1>Sedem imen, ena reka</h1><p>Trbuhovica · Obrh · Stržen · Rak · Pivka · Unica · Ljubljanica</p><button class="go" id="goAgain">⟲ Še enkrat</button><button class="go alt" id="goBack">Nazaj na zemljevid</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1,SC=1,Y0=60;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); VW=innerWidth; VH=innerHeight; cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR); SC=Math.min(VH/760,VW/620); Y0=440-(VH/SC)/2; }
addEventListener('resize',resize); resize();
const W=10400, H=1000;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), smooth=t=>t*t*(3-2*t);
function rnd(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }

// ---------------- površje (prerez) ----------------
// Vodoravno merilo: 120 px = 1 km zračne razdalje. Navpično: 0,7 px = 1 m nadmorske višine (Snežnik ni v merilu).
const KM=120, EY=e=>600-(e-270)*.7;
const X={b0:560,b1:920,l0:1760,l1:2360,c0:2720,c1:3800,r0:4100,r1:4400,p0:4820,p1:5540,v0:6860,lj0:8900,lj1:9700,s0:10220};
const E={b:750,l:580,c:550,r:500,p:450,v:290,s:270}, Yb=EY(E.b), Yl=EY(E.l), Yc=EY(E.c), Yr=EY(E.r), Yp=EY(E.p), Yv=EY(E.v), Ys=EY(E.s);
const SURF=[[0,300],[120,230],[260,70],[400,170],[500,Yb-18],[X.b0,Yb],[X.b1,Yb],[X.b1+70,Yb-40],[1250,Yb-70],[1520,Yl-150],[1690,Yl-60],[X.l0-8,Yl-30],[X.l0,Yl],[X.l1,Yl],[X.l1+70,Yl-50],[2540,Yl-120],[2670,Yc-50],[X.c0-8,Yc-26],[X.c0,Yc],[X.c1,Yc],[X.c1+60,Yc-40],[3950,Yc-105],[4060,Yr-70],[X.r0-10,Yr-66],[X.r0,Yr],[X.r1,Yr],[X.r1+12,Yr-70],[4520,Yr-120],[4680,Yp-140],[X.p0-70,Yp-110],[X.p0-6,Yp-70],[X.p0,Yp],[X.p1,Yp],[X.p1+80,Yp-50],[5800,Yp-150],[6200,Yv-250],[6560,Yv-170],[X.v0-40,Yv-110],[X.v0-6,Yv-60],[X.v0,Yv],[X.s0-60,Yv],[X.s0,Ys],[W,Ys]];
function surfY(x){ if(x<=SURF[0][0]) return SURF[0][1]; for(let i=1;i<SURF.length;i++){ if(x<=SURF[i][0]){ const a=SURF[i-1], b=SURF[i]; return lerp(a[1],b[1],smooth((x-a[0])/(b[0]-a[0]))); } } return SURF[SURF.length-1][1]; }

// ---------------- pot reke ----------------  tretji podatek: 1 = pod zemljo
function cave(x0,y0,x1,y1,sag){ const n=Math.max(4,Math.round((x1-x0)/130)), out=[[x0+22,y0+34,1]]; for(let k=1;k<n;k++){ const t=k/n; out.push([lerp(x0+40,x1-40,t),lerp(y0+46,y1+10,t)+Math.sin(t*Math.PI)*sag+Math.sin(t*9+x0)*7,1]); } out.push([x1-26,y1+12,1]); return out; }
const RIV=[[X.b0-14,Yb-12,0],[X.b0+20,Yb+4,0],[X.b1-4,Yb+4,0],...cave(X.b1,Yb,X.l0,Yl,26),[X.l0+6,Yl+4,0],[X.l1-4,Yl+4,0],...cave(X.l1,Yl,X.c0,Yc,34),[X.c0+6,Yc+4,0],[X.c1-4,Yc+4,0],...cave(X.c1,Yc,X.r0,Yr,30),[X.r0+6,Yr+4,0],[X.r1-4,Yr+4,0],...cave(X.r1,Yr,X.p0,Yp,34),[X.p0+6,Yp+4,0],[X.p1-4,Yp+4,0],...cave(X.p1,Yp,X.v0,Yv,40),[X.v0+6,Yv+4,0],[X.s0-70,Yv+4,0],[X.s0,Ys+6,0],[W,Ys+6,0]];
const CUM=[0]; for(let i=1;i<RIV.length;i++) CUM.push(CUM[i-1]+Math.hypot(RIV[i][0]-RIV[i-1][0],RIV[i][1]-RIV[i-1][1]));
const RL=CUM[CUM.length-1];
function rivAt(s){ s=clamp(s,0,RL); let i=1; while(i<CUM.length-1&&CUM[i]<s) i++; const t=(s-CUM[i-1])/(CUM[i]-CUM[i-1]||1); return [lerp(RIV[i-1][0],RIV[i][0],t),lerp(RIV[i-1][1],RIV[i][1],t),RIV[i][2]&&RIV[i-1][2]?1:(RIV[i][2]||RIV[i-1][2]?.5:0)]; }
function sAtX(x){ for(let i=1;i<RIV.length;i++){ if(RIV[i][0]>=x){ const t=(x-RIV[i-1][0])/(RIV[i][0]-RIV[i-1][0]||1); return lerp(CUM[i-1],CUM[i],clamp(t,0,1)); } } return RL; }
// Pivka: ponikne v Postojnsko jamo in po približno 9 km pod zemljo priteče v Planinsko jamo
const JX=4690, JY=(()=>{ let b=RIV[0]; for(const q of RIV) if(Math.abs(q[0]-JX)<Math.abs(b[0]-JX)) b=q; return b; })();
const PIV=[[JY[0]-1080,655],[JY[0]-930,650],[JY[0]-780,662],[JY[0]-620,650],[JY[0]-460,628],[JY[0]-300,596],[JY[0]-150,548],[JY[0]-50,505],[JY[0],JY[1]]];
const PCUM=[0]; for(let i=1;i<PIV.length;i++) PCUM.push(PCUM[i-1]+Math.hypot(PIV[i][0]-PIV[i-1][0],PIV[i][1]-PIV[i-1][1])); const PL=PCUM[PCUM.length-1];
const POS=[JY[0]-800,662];   // sredina Postojnske jame

// ---------------- stanje ----------------
let T=0, front=0, camX=300, pivT=0, lake=0, lakeTgt=0, rain=1, running=false, paused=false, runId=0, nameIdx=0;

// ---------------- risanje: pomožne ----------------
function path(pts,close){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); if(close) ctx.closePath(); }
function blob(x,y,rx,ry,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill(); }
function tree(x,s,kind,seed){ const y=surfY(x); ctx.fillStyle='#7a5230'; ctx.fillRect(x-3*s,y-22*s,6*s,24*s);
  if(kind==='p'){ for(let k=0;k<3;k++){ ctx.fillStyle=['#2f7d4a','#37915a','#41a265'][k]; ctx.beginPath(); ctx.moveTo(x,y-(78-k*4)*s); ctx.lineTo(x+(26-k*5)*s,y-(18+k*17)*s); ctx.lineTo(x-(26-k*5)*s,y-(18+k*17)*s); ctx.closePath(); ctx.fill(); } }
  else { blob(x,y-40*s,22*s,24*s,'#5aae4e'); blob(x-12*s,y-30*s,15*s,15*s,'#4f9f45'); blob(x+12*s,y-32*s,16*s,16*s,'#67ba58'); blob(x+3*s,y-52*s,13*s,13*s,'#76c764'); } }
function house(x,s,wall,roof,y0){ const y=y0==null?surfY(x):y0; ctx.fillStyle=wall; ctx.fillRect(x-20*s,y-28*s,40*s,28*s); ctx.fillStyle=roof; ctx.beginPath(); ctx.moveTo(x-26*s,y-27*s); ctx.lineTo(x,y-52*s); ctx.lineTo(x+26*s,y-27*s); ctx.closePath(); ctx.fill(); ctx.fillStyle='#6b4a2e'; ctx.fillRect(x-5*s,y-15*s,10*s,15*s); ctx.fillStyle='#ffe9a8'; ctx.fillRect(x+8*s,y-22*s,8*s,8*s); ctx.fillRect(x-16*s,y-22*s,8*s,8*s); }
function church(x,s){ const y=surfY(x); ctx.fillStyle='#fbf6ea'; ctx.fillRect(x-22*s,y-34*s,44*s,34*s); ctx.fillRect(x+6*s,y-74*s,16*s,74*s); ctx.fillStyle='#b5482f'; ctx.beginPath(); ctx.moveTo(x-27*s,y-33*s); ctx.lineTo(x-8*s,y-54*s); ctx.lineTo(x+8*s,y-33*s); ctx.closePath(); ctx.fill(); ctx.fillStyle='#6d3f2a'; ctx.beginPath(); ctx.moveTo(x+3*s,y-73*s); ctx.lineTo(x+14*s,y-104*s); ctx.lineTo(x+25*s,y-73*s); ctx.closePath(); ctx.fill(); ctx.fillStyle='#6b4a2e'; ctx.fillRect(x-12*s,y-14*s,9*s,14*s); }
function kozolec(x,s){ const y=surfY(x); ctx.fillStyle='#8a6238'; for(const dx of [-22,0,22]) ctx.fillRect(x+dx*s-2*s,y-40*s,4*s,40*s); ctx.fillStyle='#e3c56a'; for(let k=0;k<4;k++) ctx.fillRect(x-24*s,y-(34-k*8)*s,48*s,5*s); ctx.fillStyle='#7a5230'; ctx.beginPath(); ctx.moveTo(x-30*s,y-40*s); ctx.lineTo(x,y-52*s); ctx.lineTo(x+30*s,y-40*s); ctx.closePath(); ctx.fill(); }
function cow(x,s,flip){ const y=surfY(x); ctx.save(); ctx.translate(x,y); ctx.scale(flip?-s:s,s); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,-17,17,10,0,0,7); ctx.fill(); ctx.fillStyle='#5a4030'; ctx.beginPath(); ctx.ellipse(-4,-19,6,5,0,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(8,-14,4,3,0,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(18,-23,7,6,0,0,7); ctx.fill(); ctx.fillStyle='#e9b3a5'; ctx.beginPath(); ctx.ellipse(23,-21,3.5,3,0,0,7); ctx.fill(); ctx.fillStyle='#444'; ctx.fillRect(-12,-9,3,9); ctx.fillRect(-4,-9,3,9); ctx.fillRect(6,-9,3,9); ctx.fillRect(12,-9,3,9); ctx.restore(); }
function flowers(x0,x1,seed){ for(let i=0;i<Math.floor((x1-x0)/26);i++){ const x=x0+rnd(seed+i)*(x1-x0), y=surfY(x)-3; ctx.fillStyle=['#fff','#ffd84a','#ff8fb3','#ffffff'][i%4]; ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fill(); } }
function sign(x,txt,sub){ const y=surfY(x); ctx.fillStyle='#7a5230'; ctx.fillRect(x-3,y-46,6,48); ctx.font='800 17px Grandstander,Nunito,sans-serif'; let w=ctx.measureText(txt).width+18; if(sub){ ctx.font='900 13px Nunito,sans-serif'; w=Math.max(w,ctx.measureText(sub).width+18); } const h=sub?44:28; ctx.fillStyle='#ffe9b0'; ctx.strokeStyle='#5a3a1a'; ctx.lineWidth=3; ctx.beginPath(); ctx.roundRect(x-w/2,y-46-h,w,h,7); ctx.fill(); ctx.stroke(); ctx.fillStyle='#5a3a1a'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='800 17px Grandstander,Nunito,sans-serif'; ctx.fillText(txt,x,y-46-h+15); if(sub){ ctx.font='900 13px Nunito,sans-serif'; ctx.fillStyle='#a05a14'; ctx.fillText(sub,x,y-46-h+33); } }
function label(x,y,txt,col){ ctx.font='800 19px Grandstander,Nunito,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=5; ctx.strokeStyle='rgba(20,18,30,.75)'; ctx.strokeText(txt,x,y); ctx.fillStyle=col||'#ffe9b0'; ctx.fillText(txt,x,y); }
function cloud(x,y,s){ ctx.fillStyle='rgba(255,255,255,.92)'; for(const [dx,dy,r] of [[0,0,30],[30,-12,36],[66,0,30],[34,10,34]]){ ctx.beginPath(); ctx.arc(x+dx*s,y+dy*s,r*s,0,7); ctx.fill(); } }

// ---------------- risanje: svet ----------------
function drawSky(x0,x1){ const g=ctx.createLinearGradient(0,0,0,480); g.addColorStop(0,'#7ec8f4'); g.addColorStop(1,'#dff3ff'); ctx.fillStyle=g; ctx.fillRect(x0,-900,x1-x0,1420);
  // sonce in oblaki (počasna paralaksa)
  const px=camX*.75; ctx.fillStyle='rgba(255,236,150,.5)'; ctx.beginPath(); ctx.arc(px+520,90,62,0,7); ctx.fill(); ctx.fillStyle='#ffe27a'; ctx.beginPath(); ctx.arc(px+520,90,42,0,7); ctx.fill();
  for(let i=0;i<26;i++){ const cx=i*520+((T*6+i*97)%520)+camX*.45-900; if(cx<x0-200||cx>x1+200) continue; cloud(cx,60+rnd(i)*110,.7+rnd(i+9)*.6); }
  // oddaljeni hribi
  const hx=camX*.55; for(const [col,amp,base,f,ph] of [['#b9d9c8',70,330,.004,0],['#9fcbb0',90,380,.0062,2]]){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x0,520); for(let x=x0;x<=x1+20;x+=20){ const u=x-hx*(col==='#b9d9c8'?1:.6); ctx.lineTo(x,base-amp*(.5+.5*Math.sin(u*f+ph))-25*Math.sin(u*f*2.7+1)); } ctx.lineTo(x1+20,520); ctx.closePath(); ctx.fill(); } }
function drawSnezhnik(){ ctx.fillStyle='#8fa7a0'; path([[30,300],[260,68],[480,Yb-10]],true); ctx.fill(); ctx.fillStyle='#fff'; path([[203,126],[260,68],[320,134],[292,124],[262,146],[234,122]],true); ctx.fill(); label(260,40,'Snežnik · 1796 m','#fff'); }
function drawLjBack(){ const cx=X.lj0+360, y0=Yv; ctx.fillStyle='#6fb86a'; ctx.beginPath(); ctx.moveTo(cx-260,y0); ctx.quadraticCurveTo(cx,y0-250,cx+260,y0); ctx.closePath(); ctx.fill(); for(let i=0;i<9;i++) blob(cx-160+i*42,y0-55-Math.sin(i/8*3.14)*95,26,24,i%2?'#4f9f45':'#5aae4e');
  const x=cx,y=y0-137; ctx.fillStyle='#efe6d2'; ctx.fillRect(x-70,y-40,140,44); ctx.fillRect(x-14,y-96,26,60); ctx.fillStyle='#b5482f'; path([[x-76,y-40],[x-40,y-62],[x+40,y-62],[x+76,y-40]],true); ctx.fill(); ctx.fillStyle='#efe6d2'; for(let k=0;k<4;k++) ctx.fillRect(x-14+k*7,y-104,4,9); ctx.strokeStyle='#5a3a1a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x-1,y-104); ctx.lineTo(x-1,y-130); ctx.stroke(); ctx.fillStyle='#3d9b4a'; ctx.fillRect(x-1,y-130,20,7); ctx.fillStyle='#fff'; ctx.fillRect(x-1,y-123,20,6); }
function drawGround(x0,x1){ // kamnina (apnenec) + prst + trava
  ctx.beginPath(); ctx.moveTo(x0,H+900); for(let x=x0;x<=x1+12;x+=12) ctx.lineTo(x,surfY(x)); ctx.lineTo(x1+12,H+900); ctx.closePath();
  const g=ctx.createLinearGradient(0,250,0,H); g.addColorStop(0,'#d9c9a6'); g.addColorStop(.35,'#c4b391'); g.addColorStop(1,'#8f8674'); ctx.fillStyle=g; ctx.fill();
  ctx.save(); ctx.clip();
  // plasti kamnine
  ctx.lineWidth=3; for(let k=0;k<22;k++){ ctx.strokeStyle=`rgba(90,74,52,${.10+.03*(k%3)})`; ctx.beginPath(); for(let x=x0;x<=x1+30;x+=30){ const y=330+k*62+28*Math.sin(x*.0021+k*1.7)+14*Math.sin(x*.006+k); x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); }
  // razpoke in kamni
  for(let i=Math.floor(x0/90);i<x1/90;i++){ const x=i*90+rnd(i)*70, y=surfY(x)+60+rnd(i+3)*480; ctx.fillStyle=`rgba(80,66,48,${.08+rnd(i+5)*.08})`; ctx.beginPath(); ctx.ellipse(x,y,10+rnd(i+1)*18,5+rnd(i+2)*8,rnd(i)*3,0,7); ctx.fill(); }
  ctx.restore();
  // prst in trava
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); for(let x=x0;x<=x1+12;x+=12){ const y=surfY(x)+9; x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.strokeStyle='#8a6238'; ctx.lineWidth=16; ctx.stroke();
  ctx.beginPath(); for(let x=x0;x<=x1+12;x+=12){ const y=surfY(x)+1; x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.strokeStyle='#7cc35a'; ctx.lineWidth=13; ctx.stroke();
  ctx.beginPath(); for(let x=x0;x<=x1+12;x+=12){ const y=surfY(x)-3; x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.strokeStyle='#9ad86f'; ctx.lineWidth=4; ctx.stroke(); }
function caveRuns(){ const runs=[]; let cur=null; for(const p of RIV){ if(p[2]){ if(!cur){ cur=[]; runs.push(cur); } cur.push(p); } else cur=null; } return runs; }
const CAVES=caveRuns();
function drawCaves(x0,x1){ ctx.lineCap='round'; ctx.lineJoin='round'; const all=CAVES.concat([PIV]);

function h32(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return ('0000000'+h.toString(16)).slice(-8); }

async function say(txt,id){ const sub=$('sub'); sub.textContent=txt; sub.classList.add('show'); const S=splitS(txt);
  if(AUD&&S.every(x=>AUD.has(h32(x)))){ for(const x of S){ if(id!==runId) return; await new Promise(res=>{ const a=new Audio(AB+h32(x)+'.mp3'); curA=a; let done=false; const fin=()=>{ if(!done){ done=true; res(); } }; a.onended=fin; a.onerror=fin; const p=a.play(); if(p&&p.catch) p.catch(()=>{ setTimeout(fin,600+x.length*70); }); }); curA=null; await wait(120); } }
  else { let spoke=false; try{ if(window.speechSynthesis){ const v=speechSynthesis.getVoices().find(v=>/^sl/i.test(v.lang)); if(v){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.voice=v; u.lang='sl-SI'; u.rate=.92; spoke=true; await new Promise(res=>{ u.onend=res; u.onerror=res; speechSynthesis.speak(u); setTimeout(res,3000+txt.length*110); }); } } }catch(e){} if(!spoke) await wait(1400+txt.length*62); }
  if(id===runId) sub.classList.remove('show'); }
function stopAudio(){ try{ if(curA){ curA.onended=null; curA.pause(); curA=null; } if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
async function run(){ const id=++runId; stopAudio(); front=0; pivT=0; lake=0; lakeTgt=0; fx=''; nameIdx=0; running=true; paused=false; $('bPause').textContent='⏸'; $('name').classList.remove('show'); document.querySelectorAll('#dots i').forEach(e=>e.classList.remove('on')); $('ovStart').classList.remove('show'); $('ovEnd').classList.remove('show');
  for(const st of STORY){ if(id!==runId) return; if(st.x!=null) await moveTo(st.x); if(id!==runId) return;
    if(st.fx==='lakeUp') lakeTgt=1; if(st.fx==='lakeDown') lakeTgt=0; if(st.fx==='pivka') fx='pivka';

    await say(st.say,id); if(id!==runId) return; await wait(350); }
  if(id!==runId) return; await moveTo(W); if(id!==runId) return; running=false; $('ovEnd').classList.add('show'); }

$('goStart').onclick=run; $('goAgain').onclick=run; $('bAgain').onclick=run; $('bBack').onclick=goBack; $('goBack').onclick=goBack;
