name: Maya1 vzorec
on: { workflow_dispatch: {}, push: { branches: [main], paths: ['tools/maya_sample.py', '.github/workflows/maya-vzorec.yml'] } }
permissions: { contents: write }
jobs:
  vzorec:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers peft snac soundfile phonemizer accelerate
      - run: python tools/maya_sample.py
        timeout-minutes: 270
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add tools/maya/vzorci || true
          git diff --cached --quiet || (git commit -qm "Maya1: vzorci" && git pull -q --rebase origin main && git push -q origin HEAD:main)
