name: Zlogi – glas OpenAI
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: ['tools/zlogi_openai.json', 'tools/zlogi_openai.py', '.github/workflows/zlogi-openai.yml'] }
permissions: { contents: write }
concurrency: { group: zlogi-openai, cancel-in-progress: false }
jobs:
  posnemi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q openai
      - name: Posnemi
        env:
          OPENAI_API_KEY: ${{ secrets.ZVOK || secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "::error::Ni API ključa – shrani ga kot secret ZVOK"; exit 1; fi
          python tools/zlogi_openai.py
      - name: Združi v zvok.mp3 (samo način »vse«)
        run: |
          if grep -q '"nacin": *"vse"' tools/zlogi_openai.json; then python tools/zlogi_zdruzi.py; fi
      - name: Shrani
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add zlogi/zvok zlogi/zvok_test zlogi/zvok.mp3 zlogi/zvok.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Zlogi: glas OpenAI ($(grep -o '"nacin": *"[a-z]*"' tools/zlogi_openai.json))"
          for k in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((5 + k * 7)); done
          exit 1
