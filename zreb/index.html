<!DOCTYPE html>
<html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Žreb barv</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: party, playful, one-night
   IDEA: a fairground prize wheel under a winter night sky
   PICTURE: the big 5-colour wheel with a pointer, then fireworks in the drawn colour
   COLOUR and TYPE: deep night teal ground, white ink, the five team colours; Baloo 2
   LAYOUT: one column: title, wheel, password field */
:root{color-scheme:dark;--bg:#0b2427;--ink:#f4f7f6;--mut:#9fbcbc;--card:#123236}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#164246 0%,var(--bg) 60%);background-color:var(--bg);color:var(--ink);font:17px/1.5 "Baloo 2",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:56px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;z-index:2}
h1{font-size:clamp(26px,7vw,38px);line-height:1.05;margin:0;font-weight:800;text-wrap:balance}
.rules{margin:0;padding:8px 12px 8px 28px;text-align:left;background:var(--card);border-radius:16px;width:100%;color:#dbe8e7;font-size:14px;line-height:1.3}.rules li{margin:1px 0}.rules b{color:#fff}
.wheelbox{position:relative;width:min(72vw,42vh,340px);aspect-ratio:1}
.wheelbox svg{width:100%;height:100%;display:block}
#wheel{transform-origin:center center;will-change:transform;transition:transform 5.2s cubic-bezier(.12,.75,.12,1)}
.pin{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid #ffd54a;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));z-index:3}
form{display:flex;gap:10px;width:100%;flex-wrap:wrap;justify-content:center}
input{flex:1 1 200px;font:600 20px "Baloo 2",system-ui;padding:10px 14px;border-radius:14px;border:2px solid #2c5a5e;background:var(--card);color:var(--ink);text-transform:uppercase;letter-spacing:.06em;text-align:center;min-height:52px}
input:focus,button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button{font:700 19px "Baloo 2",system-ui;padding:10px 22px;border:0;border-radius:14px;background:#fff;color:#0b2427;min-height:52px;cursor:pointer}
button:disabled{opacity:.55}
.msg{min-height:28px;margin:0;color:var(--mut)}
.msg.err{color:#ff8f8f}
.result{display:none;padding:18px 20px;border-radius:20px;width:100%;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.result.on{display:block;animation:pop .5s ease-out}
.result .big{font-size:clamp(36px,11vw,56px);font-weight:800;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.result p{margin:4px 0 0}
.bulb{animation:tw 1.2s ease-in-out infinite alternate}@keyframes tw{from{opacity:1}to{opacity:.35}}
.snow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}.snow i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;animation:fall linear infinite}@keyframes fall{to{transform:translate(30px,105vh)}}
@media (prefers-reduced-motion:reduce){.snow,.bulb{animation:none}.snow{display:none}}
.mute{position:fixed;top:10px;right:10px;z-index:5;font-size:14px;padding:6px 12px;min-height:44px;background:rgba(255,255,255,.14);color:#fff;border-radius:12px}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#wheel{transition-duration:.01s}.result.on{animation:none}}
</style></head><body>
<div class="snow" id="snow"></div><button id="mute" class="mute" type="button" aria-pressed="false">Zvok: vklop</button><canvas id="fw"></canvas>
<main>
<h1>Božični žreb barv</h1>
<ol class="rules">
<li>Vsak dobi svoje geslo. Vpiši ga spodaj in zavrti kolo.</li>
<li>Vsak par dobi <b>svojo barvo</b>: dva para ne moreta dobiti iste barve.</li>
<li>Oba v paru dobita <b>isto barvo</b>, ne glede na to, kdo vrti.</li>
<li>Kolo lahko zavrtiš samo enkrat.</li>
</ol>
<div class="wheelbox"><div class="pin"></div><svg id="wheel" viewBox="-110 -110 220 220" aria-label="Kolo barv"></svg></div>
<form id="f" autocomplete="off"><input id="pw" placeholder="Tvoje geslo" aria-label="Geslo" autocapitalize="characters" spellcheck="false"><button id="go">Zavrti</button></form>
<p class="msg" id="msg"></p>
<div class="result" id="res"></div>
</main>

{

setTimeout(()=>{const [n,h]=C[r.c];res.style.background=h;res.innerHTML=`<p>${esc(r.n)} in ${esc(r.p)}, vajina barva je</p><div class="big">${esc(n)}</div>`;res.className='result on';fanfare();msg.textContent='';f.style.display='none';document.querySelector('.rules').style.display='none';msg.style.display='none';res.scrollIntoView({behavior:'smooth',block:'center'});fire(h)},dur)});
